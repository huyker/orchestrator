[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-issue-orchestrator"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["orchestrator"]

[tool.setuptools.package-data]
orchestrator = ["static/*.html"]
