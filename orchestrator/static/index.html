<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Issue Orchestrator</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
    body { margin:0; background:#0d1117; color:#e6edf3; }
    header { padding:18px 24px; border-bottom:1px solid #30363d; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:20px; } h2 { margin:0 0 12px; font-size:15px; }
    .muted { color:#8b949e; } .small { font-size:12px; }
    main { max-width:1500px; margin:0 auto; padding:20px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; align-items:center; }
    button,select { background:#21262d; border:1px solid #30363d; color:#e6edf3; padding:8px 12px; border-radius:7px; }
    button { cursor:pointer; } button:hover { background:#30363d; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:14px; min-width:0; }
    .wide { grid-column:1/-1; }
    .badge { display:inline-block; padding:3px 7px; border-radius:999px; background:#21262d; border:1px solid #30363d; font-size:12px; margin:2px 3px 2px 0; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:420px; overflow:auto; background:#0d1117; padding:10px; border-radius:8px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; border-bottom:1px solid #21262d; padding:7px 5px; vertical-align:top; }
    a { color:#58a6ff; text-decoration:none; }
    .ok { color:#3fb950; } .bad { color:#f85149; } .warn { color:#d29922; }
    #toast { min-height:20px; margin-bottom:8px; }
  </style>
</head>
<body>
<header>
  <div><h1>Issue Orchestrator</h1><div class="muted">Project Issue → local agents → project PR → GPT review</div></div>
  <div id="runtime" class="badge">loading…</div>
</header>
<main>
  <div class="toolbar">
    <button onclick="act('resume')">Start / Resume</button>
    <button onclick="act('pause')">Pause</button>
    <button onclick="act('once')">Process once</button>
    <button onclick="act('sync')">Sync projects</button>
    <button onclick="act('retry')">Retry via Issue</button>
    <button onclick="refresh()">Refresh</button>
    <span class="muted">Project:</span>
    <select id="projectSelect" onchange="renderSelectedProject()"></select>
  </div>
  <div id="toast" class="muted"></div>
  <div class="grid">
    <section class="card"><h2>Active task</h2><div id="active"></div></section>
    <section class="card"><h2>Registered projects</h2><div id="projects"></div></section>
    <section class="card"><h2>Issue queue</h2><div id="issues"></div></section>
    <section class="card"><h2>Recent runtime events</h2><div id="events"></div></section>
    <section class="card wide"><h2>Selected project configuration</h2><div id="selectedProject"></div></section>
  </div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastStatus = null;
async function api(path, opts={}) {
  const next={...opts};
  if ((next.method||'GET').toUpperCase()==='POST') next.headers={...(next.headers||{}),'X-Orchestrator-UI':'1'};
  const r=await fetch(path,next); const j=await r.json(); if(!r.ok||j.ok===false) throw new Error(j.error||r.statusText); return j;
}
async function act(name) {
  const toast=document.getElementById('toast');
  try { const j=await api('/api/control/'+name,{method:'POST'}); toast.textContent=j.message||('Done: '+name); await refresh(); }
  catch(e){ toast.textContent='Error: '+e.message; }
}
async function graphify(id){
  const toast=document.getElementById('toast');
  try { await api('/api/projects/'+encodeURIComponent(id)+'/graphify/update',{method:'POST'}); toast.textContent='Graphify updated: '+id; await refresh(); }
  catch(e){ toast.textContent='Graphify error: '+e.message; }
}
function renderActive(a){
  if(!a) return '<span class="muted">No active task</span>';
  const repo=a.payload?.issue_repo||'';
  return `<div><b>${esc(repo)}#${esc(a.issue_number)}</b> <span class="badge">${esc(a.status)}</span></div><pre>${esc(JSON.stringify(a.payload,null,2))}</pre>`;
}
function renderProjects(rows){
  if(!rows.length) return '<span class="muted">No projects</span>';
  return rows.map(p=>{const g=p.graphify||{}; return `<div style="margin-bottom:14px"><b>${esc(p.id)}</b> <span class="muted">${esc(p.repo)}</span><br>
    <span class="badge">${p.synced?'synced':'not synced'}</span>
    <span class="badge">Issues: ${esc(p.issues_repo||p.repo)}</span>
    <span class="badge">Graphify: ${g.enabled?(g.cli_available?(g.graph_exists?'ready':'no graph'):'CLI missing'):'off'}</span>
    ${g.enabled?`<button onclick="graphify('${esc(p.id)}')">Update graph</button>`:''}
    <div class="muted">Agents: ${esc((p.agents||[]).join(', ')||'—')}</div>
    <div class="muted">Task profiles: ${esc((p.task_profiles||[]).join(', ')||'—')}</div>
    ${p.error?`<div class="bad">${esc(p.error)}</div>`:''}</div>`}).join('');
}
function renderIssues(rows){
  if(!rows.length) return '<span class="muted">No orch-labelled open Issues in registered project queues</span>';
  return `<table><tr><th>Project Issue</th><th>Task</th><th>Labels</th></tr>${rows.map(i=>{
    const t=i.task||{};
    const task=i.task_error?`<span class="bad">${esc(i.task_error)}</span>`:`<b>${esc(t.task_id||'—')}</b><br><span class="muted">${esc(t.project||'')} · ${esc(t.type||'')} · rev ${esc(t.revision??'')}</span>`;
    return `<tr><td><a target="_blank" href="${esc(i.url)}">${esc(i.issue_repo)}#${i.number}<br>${esc(i.title)}</a></td><td>${task}</td><td>${esc(i.labels.join(', '))}</td></tr>`;
  }).join('')}</table>`;
}
function renderEvents(rows){ return '<pre>'+esc(rows.map(e=>new Date(e.created_at*1000).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.payload)).join('\n'))+'</pre>'; }
function syncProjectSelector(rows){
  const select=document.getElementById('projectSelect');
  const current=select.value;
  const ids=rows.map(p=>p.id);
  select.innerHTML=ids.map(id=>`<option value="${esc(id)}">${esc(id)}</option>`).join('');
  if(ids.includes(current)) select.value=current;
}
function renderSelectedProject(){
  const host=document.getElementById('selectedProject');
  if(!lastStatus){host.innerHTML='<span class="muted">Loading…</span>';return;}
  const id=document.getElementById('projectSelect').value;
  const p=(lastStatus.projects||[]).find(x=>x.id===id);
  if(!p){host.innerHTML='<span class="muted">Select a project</span>';return;}
  const g=p.graphify||{};
  host.innerHTML=`<div><b>${esc(p.id)}</b> — repo <code>${esc(p.repo)}</code> — Issue queue <code>${esc(p.issues_repo||p.repo)}</code></div>
    <div style="margin:8px 0"><span class="badge">Graphify ${g.enabled?'enabled':'off'}</span><span class="badge">${g.graph_exists?'graph ready':'no graph'}</span></div>
    <div class="grid">
      <div><div class="muted small">Plans loaded</div><pre>${esc(JSON.stringify(p.plans||[],null,2))}</pre></div>
      <div><div class="muted small">Agent profiles loaded from project</div><pre>${esc(JSON.stringify(p.agent_profiles||{},null,2))}</pre></div>
      <div><div class="muted small">Task profiles loaded from project</div><pre>${esc(JSON.stringify(p.task_profile_configs||{},null,2))}</pre></div>
      <div><div class="muted small">Graphify state</div><pre>${esc(JSON.stringify(g,null,2))}</pre></div>
    </div>`;
}
async function refresh(){
  try {
    const s=await api('/api/status'); lastStatus=s;
    document.getElementById('runtime').textContent=s.paused?'PAUSED':'RUNNING';
    document.getElementById('active').innerHTML=renderActive(s.active);
    document.getElementById('projects').innerHTML=renderProjects(s.projects||[]);
    document.getElementById('issues').innerHTML=renderIssues(s.issues||[]);
    document.getElementById('events').innerHTML=renderEvents(s.events||[]);
    syncProjectSelector(s.projects||[]); renderSelectedProject();
  } catch(e){document.getElementById('toast').textContent='Status error: '+e.message;}
}
refresh(); setInterval(refresh,5000);
</script>
</body>
</html>
